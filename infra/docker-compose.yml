version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.14
    command:
      - >-
        redpanda start --mode dev-container --overprovisioned --smp 1 --memory 1G
        --reserve-memory 0M --node-id 0 --check=false
        --kafka-addr 0.0.0.0:9092,0.0.0.0:19092
        --advertise-kafka-addr redpanda:9092,localhost:19092
    ports:
      - "19092:19092"   # Kafka (external)
      - "9644:9644"     # Admin API

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

networks:
  default:
    name: freelas_net

