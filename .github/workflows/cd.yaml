name: CD (Docker Hub + GitOps)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  FALLBACK_DOCKER_ORG: dan1993

jobs:
  build_and_push_images:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, matcher, web]

    steps:
      - name: Checkout same SHA as CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve ENV/TAG from branch
        id: vars
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          case "$REF_NAME" in
            develop) ENV=dev ;;
            hmg)     ENV=hmg ;;
            main|master) ENV=prd ;;
            *)       ENV=dev ;;
          esac
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          ORG="${{ secrets.DOCKER_USERNAME }}"
          if [ -z "$ORG" ]; then ORG="$FALLBACK_DOCKER_ORG"; fi
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "DOCKER_ORG=$ORG" >> $GITHUB_ENV
          echo "IMMUTABLE_TAG=${ENV}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_API_URL=http://api.$ENV.localtest.me" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.IMMUTABLE_TAG }}
            ${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.ENV }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          provenance: false

  update_gitops_repo:
    needs: build_and_push_images
    runs-on: ubuntu-latest
    steps:
      - name: Determine ENV again (from CI branch)
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          case "$REF_NAME" in
            develop) ENV=dev ;;
            hmg)     ENV=hmg ;;
            main|master) ENV=prd ;;
            *)       ENV=dev ;;
          esac
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "IMMUTABLE_TAG=${ENV}-${SHORT_SHA}" >> $GITHUB_ENV
          ORG="${{ secrets.DOCKER_USERNAME }}"
          if [ -z "$ORG" ]; then ORG="dan1993"; fi
          echo "DOCKER_ORG=$ORG" >> $GITHUB_ENV

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update images and commit
        run: |
          cd gitops/k8s/overlays/${ENV}
          # usa tag imutável (env-SHORTSHA) para garantir deploy determinístico
          kustomize edit set image freelas-api=${DOCKER_ORG}/freelas-api:${IMMUTABLE_TAG}
          kustomize edit set image freelas-matcher=${DOCKER_ORG}/freelas-matcher:${IMMUTABLE_TAG}
          kustomize edit set image freelas-web=${DOCKER_ORG}/freelas-web:${IMMUTABLE_TAG}
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "cd: ${ENV} -> ${IMMUTABLE_TAG} (from ${SHORT_SHA})" || echo "No changes"
          git push
