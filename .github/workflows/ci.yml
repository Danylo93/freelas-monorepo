name: CI

on:
  push:
    branches: [ main, master, develop, hmg, feature/** ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api]   # ajuste enquanto versiona yarn.lock dos demais

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect yarn.lock
        id: lock
        run: |
          if [ -f "${{ matrix.service }}/yarn.lock" ]; then
            echo "has_lock=true" >> $GITHUB_OUTPUT
            echo "path=${{ matrix.service }}/yarn.lock" >> $GITHUB_OUTPUT
          else
            echo "has_lock=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node (cache só se houver yarn.lock)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.lock.outputs.has_lock == 'true' && 'yarn' || '' }}
          cache-dependency-path: ${{ steps.lock.outputs.path }}

      - name: Remover package-lock (se existir)
        run: |
          rm -f package-lock.json ${{ matrix.service }}/package-lock.json || true

      - name: Corepack + Yarn classic
        working-directory: ${{ matrix.service }}
        run: |
          corepack enable
          yarn set version classic

      - name: Install deps
        if: steps.lock.outputs.has_lock == 'true'
        working-directory: ${{ matrix.service }}
        run: yarn install --frozen-lockfile

      - name: Build
        if: steps.lock.outputs.has_lock == 'true'
        working-directory: ${{ matrix.service }}
        run: yarn build

      - name: Test
        if: steps.lock.outputs.has_lock == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          if yarn run | grep -q "^  test"; then
            yarn test
          else
            echo "No test script for ${{ matrix.service }}, skipping."
          fi

      - name: Aviso de lock ausente
        if: steps.lock.outputs.has_lock != 'true'
        run: |
          echo "::warning::${{ matrix.service }} pulado: adicione e versione ${{ matrix.service }}/yarn.lock"
