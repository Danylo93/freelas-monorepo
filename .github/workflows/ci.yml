name: CI

on:
  push:
    branches: [ main, master, develop, hmg, feature/** ]
  pull_request:

jobs:
  build_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                # << não cancela os outros
      matrix:
        service: [api, matcher, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect yarn.lock
        id: lock
        run: |
          if [ -f "${{ matrix.service }}/yarn.lock" ]; then
            echo "has_lock=true" >> $GITHUB_OUTPUT
            echo "path=${{ matrix.service }}/yarn.lock" >> $GITHUB_OUTPUT
          else
            echo "has_lock=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node (with cache when lock exists)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.lock.outputs.has_lock == 'true' && 'yarn' || '' }}
          cache-dependency-path: ${{ steps.lock.outputs.path }}

      - name: Remove npm lockfile (se existir)
        run: |
          rm -f package-lock.json ${{ matrix.service }}/package-lock.json || true

      - name: Enable Corepack + Yarn classic
        working-directory: ${{ matrix.service }}
        run: |
          corepack enable
          yarn set version classic
          printf '%s\n' 'yarnPath: .yarn/releases/yarn-1.22.22.cjs' > .yarnrc 2>/dev/null || true

      # Se não houver yarn.lock, pulamos o serviço por enquanto
      - name: Instalar deps
        if: steps.lock.outputs.has_lock == 'true'
        working-directory: ${{ matrix.service }}
        run: yarn install --frozen-lockfile

      - name: Build
        if: steps.lock.outputs.has_lock == 'true'
        working-directory: ${{ matrix.service }}
        run: yarn build

      - name: Test
        working-directory: ${{ matrix.service }}
        run: yarn test

      - name: Aviso de lock ausente
        if: steps.lock.outputs.has_lock != 'true'
        run: |
          echo "::warning::${{ matrix.service }} pulado: adicione e versione ${{ matrix.service }}/yarn.lock"
