name: Web Release

on:
  workflow_run:
    workflows: [Web CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev|hmg|prd"
        default: dev
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: dev

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Print previous CI result (if any)
        run: echo "Upstream CI conclusion: ${{ github.event.workflow_run.conclusion || 'n/a' }}"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'dan1993' }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve env/tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BR="${{ github.event.workflow_run.head_branch }}"; SHA="${{ github.event.workflow_run.head_sha }}";
            case "$BR" in develop) ENV=dev;; hmg) ENV=hmg;; main|master) ENV=prd;; *) ENV=dev;; esac
          else
            ENV="${{ inputs.environment || github.event.inputs.environment || 'dev' }}"; SHA="${{ github.sha }}";
          fi
          ORG="${{ secrets.DOCKER_USERNAME }}"; if [ -z "$ORG" ]; then ORG="dan1993"; fi
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "SHA=$SHA" >> $GITHUB_ENV
          echo "TAG_IMMUT=$ENV-$SHA" >> $GITHUB_ENV
          echo "API_URL=http://api.$ENV.localtest.me" >> $GITHUB_ENV
          echo "Releasing Web -> $ORG/freelas-web:$ENV and $ORG/freelas-web:$ENV-$SHA | API_URL=$API_URL"
      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.ORG }}/freelas-web:${{ env.ENV }}
            ${{ env.ORG }}/freelas-web:${{ env.TAG_IMMUT }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
      - name: Summary
        run: |
          echo "Web Release" >> $GITHUB_STEP_SUMMARY
          echo "Env: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- $ORG/freelas-web:$ENV" >> $GITHUB_STEP_SUMMARY
          echo "- $ORG/freelas-web:$TAG_IMMUT" >> $GITHUB_STEP_SUMMARY
