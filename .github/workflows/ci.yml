name: CI

on:
  push:
    branches: [ main, master, develop, hmg, feature/** ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      matcher: ${{ steps.filter.outputs.matcher }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/shared/**'
            matcher:
              - 'matcher/**'
              - 'packages/shared/**'
            web:
              - 'web/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - name: API build+test
        working-directory: api
        run: |
          corepack enable
          yarn set version classic
          yarn install --frozen-lockfile || yarn install
          yarn build
          yarn test || echo "no tests"

  matcher:
    needs: changes
    if: needs.changes.outputs.matcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Matcher build+test
        working-directory: matcher
        run: |
          corepack enable
          yarn set version classic
          yarn install || true
          yarn build
          yarn test || echo "no tests"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web build (typecheck)
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          corepack enable
          yarn set version classic
          yarn install || true
          yarn build
