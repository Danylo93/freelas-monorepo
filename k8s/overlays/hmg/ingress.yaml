apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freelas-hmg
  namespace: freelas
spec:
  ingressClassName: nginx
  rules:
    - host: api.hmg.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
    - host: web.hmg.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000

