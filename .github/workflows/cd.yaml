name: CD (Docker Hub + GitOps)

on:
  workflow_run:
    workflows: ["CI"]               # roda apenas quando o workflow CI terminar
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # fallback do org, caso não tenha secret
  FALLBACK_DOCKER_ORG: dan1993

jobs:
  build_and_push_images:
    # garante que só execute quando o CI concluir com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, matcher, web]

    steps:
      - name: Checkout code at same SHA as CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve environment/tag
        id: vars
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          case "$REF_NAME" in
            develop) ENV=dev ;;
            hmg) ENV=hmg ;;
            main|master) ENV=prd ;;
            *) ENV=dev ;;
          esac
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "TAG=$ENV" >> $GITHUB_ENV
          ORG="${{ secrets.DOCKER_USERNAME }}"
          if [ -z "$ORG" ]; then ORG="$FALLBACK_DOCKER_ORG"; fi
          echo "DOCKER_ORG=$ORG" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_API_URL=http://api.$ENV.localtest.me" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ github.event.workflow_run.head_sha }}" | cut -c1-7 >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.TAG }}
            ${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.TAG }}-${{ github.event.workflow_run.head_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}

  update_gitops_repo:
    # só roda se imagens forem construídas
    needs: build_and_push_images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          # use um PAT com permissão de push no repositório GitOps
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Determine environment
        run: |
          REF_NAME="${{ github.event.workflow_run.head_branch }}"
          case "$REF_NAME" in
            develop) ENV=dev ;;
            hmg) ENV=hmg ;;
            main|master) ENV=prd ;;
            *) ENV=dev ;;
          esac
          echo "ENV=$ENV" >> $GITHUB_ENV

      - name: Edit images with Kustomize and commit
        run: |
          cd gitops/k8s/overlays/${ENV}
          kustomize edit set image freelas-api=${DOCKER_ORG}/freelas-api:${ENV}
          kustomize edit set image freelas-matcher=${DOCKER_ORG}/freelas-matcher:${ENV}
          kustomize edit set image freelas-web=${DOCKER_ORG}/freelas-web:${ENV}
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "chore(cd): set images to ${ENV} (${{ github.event.workflow_run.head_sha }} )" || echo "No changes"
          git push
