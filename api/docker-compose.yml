version: "3.9"
services:
  api:
    image: node:20
    working_dir: /app
    command: sh -lc "corepack enable && yarn set version classic && yarn install && yarn dev"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - API_PORT=3001
      - KAFKA_BROKERS=redpanda.freelas.svc.cluster.local:9092
      - USE_REAL_KAFKA=true

      - REDIS_URL=redis://redis:6379
      - USE_REAL_REDIS=true
    ports: ["3001:3001"]
    volumes:
      - ./:/app
    networks:
      - freelas_net

networks:
  freelas_net:
    external: true
