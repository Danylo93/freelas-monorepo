name: Matcher Release

on:
  workflow_run:
    workflows: [Matcher CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev|hmg|prd"
        default: dev
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: dev

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Print previous CI result (if any)
        run: echo "Upstream CI conclusion: ${{ github.event.workflow_run.conclusion || 'n/a' }}"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'dan1993' }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve env/tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BR="${{ github.event.workflow_run.head_branch }}"; SHA="${{ github.event.workflow_run.head_sha }}";
            case "$BR" in develop) ENV=dev;; hmg) ENV=hmg;; main|master) ENV=prd;; *) ENV=dev;; esac
          else
            ENV="${{ inputs.environment || github.event.inputs.environment || 'dev' }}"; SHA="${{ github.sha }}";
          fi
          ORG="${{ secrets.DOCKER_USERNAME }}"; if [ -z "$ORG" ]; then ORG="dan1993"; fi
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "SHA=$SHA" >> $GITHUB_ENV
          echo "TAG_IMMUT=$ENV-$SHA" >> $GITHUB_ENV
          echo "Releasing Matcher -> $ORG/freelas-matcher:$ENV and $ORG/freelas-matcher:$ENV-$SHA"
      - name: Build & Push Matcher
        uses: docker/build-push-action@v6
        with:
          context: ./matcher
          push: true
          tags: |
            ${{ env.ORG }}/freelas-matcher:${{ env.ENV }}
            ${{ env.ORG }}/freelas-matcher:${{ env.TAG_IMMUT }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"
      - name: Prepare kubeconfig (optional)
        id: kube
        env:
          KUBECONFIG_B64_DEV: ${{ secrets.KUBECONFIG_B64_DEV }}
          KUBECONFIG_B64_HMG: ${{ secrets.KUBECONFIG_B64_HMG }}
          KUBECONFIG_B64_PRD: ${{ secrets.KUBECONFIG_B64_PRD }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          KC=""
          case "$ENV" in
            dev) KC="$KUBECONFIG_B64_DEV" ;;
            hmg) KC="$KUBECONFIG_B64_HMG" ;;
            prd) KC="$KUBECONFIG_B64_PRD" ;;
          esac
          if [ -z "$KC" ]; then KC="$KUBECONFIG_B64"; fi
          if [ -z "$KC" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::No kubeconfig secret found. Skipping deploy."
            exit 0
          fi
          echo "$KC" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV
          echo "configured=true" >> $GITHUB_OUTPUT
      - name: Deploy Matcher (optional)
        if: steps.kube.outputs.configured == 'true'
        run: |
          cd k8s/overlays/${ENV}
          kustomize edit set image freelas-matcher=${ORG}/freelas-matcher:${TAG_IMMUT}
          kustomize build . | kubectl apply -f -
      - name: Summary
        run: |
          echo "Matcher Release" >> $GITHUB_STEP_SUMMARY
          echo "Env: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- $ORG/freelas-matcher:$ENV" >> $GITHUB_STEP_SUMMARY
          echo "- $ORG/freelas-matcher:$TAG_IMMUT" >> $GITHUB_STEP_SUMMARY
          echo "Deploy: ${{ steps.kube.outputs.configured == 'true' && 'applied via kustomize' || 'skipped (no kubeconfig)' }}" >> $GITHUB_STEP_SUMMARY
