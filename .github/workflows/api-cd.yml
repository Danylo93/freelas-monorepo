name: API CD

on:
  workflow_run:
    workflows: [API Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "environment to deploy (kept dev)"
        default: dev

concurrency:
  group: api-cd-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve env/sha/org
        run: |
          # Force deployment to dev environment
          ENV=dev
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          ORG="${{ secrets.DOCKER_USERNAME }}"; [ -z "$ORG" ] && ORG="dan1993"
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "TAG_IMMUT=$ENV-$SHA" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare kubeconfig (optional)
        id: kube
        env:
          # Preferred: repository/organization Secrets
          KUBECONFIG_B64_DEV: ${{ secrets.KUBECONFIG_B64_DEV }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          # Optional inline (Repository Variables) if you want to "colocar direto"
          INLINE_KUBECONFIG_B64: ${{ vars.KUBECONFIG_B64_DEV }}
          INLINE_KUBECONFIG_RAW: ${{ vars.KUBECONFIG_DEV_RAW }}
        run: |
          set -e
          KC="${KUBECONFIG_B64_DEV:-}"
          [ -z "$KC" ] && KC="${KUBECONFIG_B64:-}"
          if [ -n "$KC" ]; then
            # Try to decode as base64; ignore garbage; if decode fails, treat as raw YAML
            if ! echo "$KC" | base64 --decode --ignore-garbage > kubeconfig 2>/dev/null; then
              printf "%s" "$KC" > kubeconfig
            fi
          elif [ -n "${INLINE_KUBECONFIG_B64:-}" ]; then
            if ! echo "$INLINE_KUBECONFIG_B64" | base64 --decode --ignore-garbage > kubeconfig 2>/dev/null; then
              printf "%s" "$INLINE_KUBECONFIG_B64" > kubeconfig
            fi
          elif [ -n "${INLINE_KUBECONFIG_RAW:-}" ]; then
            printf "%s" "$INLINE_KUBECONFIG_RAW" > kubeconfig
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::No kubeconfig provided via secrets or vars. Skipping CD."
            exit 0
          fi
          if ! grep -q "clusters:" kubeconfig; then
            echo "::warning::kubeconfig may be invalid (no 'clusters:' key)."
          fi
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV
          echo "configured=true" >> $GITHUB_OUTPUT

      - name: Apply manifests
        if: steps.kube.outputs.configured == 'true'
        run: |
          cd k8s/overlays/dev
          kustomize edit set image freelas-api=${ORG}/freelas-api:${TAG_IMMUT}
          kustomize build . | kubectl apply -f -

      - name: Summary
        run: |
          echo "API CD" >> $GITHUB_STEP_SUMMARY
          echo "Env: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "Image: $ORG/freelas-api:${TAG_IMMUT}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.kube.outputs.configured == 'true' && 'applied' || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
