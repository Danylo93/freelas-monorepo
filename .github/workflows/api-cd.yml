name: API CD

on:
  workflow_run:
    workflows: ["API Release"]      # tem que ser o name exato do workflow que builda a imagem
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev|hmg|prd"
        default: dev

permissions:
  contents: write

concurrency:
  group: api-cd-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  gitops:
    # roda automático após o "API Release" com sucesso; ou manual pelo dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolver ENV/SHA e ORG
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BR="${{ github.ref_name }}"; ENV="${{ github.event.inputs.environment }}"; SHA="${{ github.sha }}"
          else
            BR="${{ github.event.workflow_run.head_branch }}"; SHA="${{ github.event.workflow_run.head_sha }}"
            case "$BR" in
              develop) ENV=dev ;; hmg) ENV=hmg ;; main|master) ENV=prd ;; *) ENV=dev ;;
            esac
          fi
          SHORT=$(echo "$SHA" | cut -c1-7)
          ORG="${{ secrets.DOCKER_USERNAME }}"; [ -z "$ORG" ] && ORG="dan1993"
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "SHORT=$SHORT" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV

      - name: Preparar credenciais HTTP para Gitea (sem vazar nos logs)
        env:
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_USER: ${{ secrets.GITEA_USER }}
          GITEA_PAT:  ${{ secrets.GITEA_PAT }}
        run: |
          if [ -z "$GITEA_URL" ] || [ -z "$GITEA_USER" ] || [ -z "$GITEA_PAT" ]; then
            echo "::error::Defina GITEA_URL, GITEA_USER e GITEA_PAT em Settings > Secrets"
            exit 1
          fi
          cat <<EOF >> ~/.netrc
          machine ${GITEA_URL}
          login ${GITEA_USER}
          password ${GITEA_PAT}
          EOF
          chmod 600 ~/.netrc

      - name: Clonar repo GitOps (ignorando TLS só para teste)
        env:
          GITEA_URL:  ${{ secrets.GITEA_URL }}
          GITOPS_PATH: ${{ secrets.GITOPS_PATH }}   # ex: danylo/gitops.git
        run: |
          export GIT_SSL_NO_VERIFY=true
          git -c http.sslVerify=false clone --depth 1 "https://${GITEA_URL}/${GITOPS_PATH}" gitops
          git -C gitops config user.email "action@github.com"
          git -C gitops config user.name "GitHub Action"

      - name: Instalar kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Garantir overlay e kustomization (primeiro uso)
        run: |
          mkdir -p gitops/k8s/overlays/${ENV}
          if [ ! -f "gitops/k8s/overlays/${ENV}/kustomization.yaml" ]; then
            cat > gitops/k8s/overlays/${ENV}/kustomization.yaml <<'YAML'
            apiVersion: kustomize.config.k8s.io/v1beta1
            kind: Kustomization
            # ajuste quando tiver a base
            # resources:
            #   - ../../base
            YAML
          fi

      - name: Atualizar imagem e fazer push
        run: |
          cd gitops/k8s/overlays/${ENV}
          kustomize edit set image freelas-api=${ORG}/freelas-api:${ENV}-${SHORT}
          git add .
          git commit -m "api:${ENV}-${SHORT}" || echo "No changes"
          export GIT_SSL_NO_VERIFY=true
          git -c http.sslVerify=false push
