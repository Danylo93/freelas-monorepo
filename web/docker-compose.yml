version: "3.9"
services:
  web:
    image: node:20
    working_dir: /app
    command: sh -lc "corepack enable && yarn set version classic && yarn install && HOST=0.0.0.0 yarn dev"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:3001
    ports: ["3000:3000"]
    volumes:
      - ./:/app
    networks:
      - freelas_net

networks:
  freelas_net:
    external: true
