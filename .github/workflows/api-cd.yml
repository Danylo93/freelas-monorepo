name: API CD

on:
  workflow_run:
    workflows: ["API Release"]   # precisa casar com o name do workflow que produz a imagem
    types: [completed]

permissions:
  contents: write

concurrency:
  group: api-cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  gitops:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve env/sha
        run: |
          BR="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          case "$BR" in
            develop) ENV=dev ;;
            hmg) ENV=hmg ;;
            main|master) ENV=prd ;;
            *) ENV=dev ;;
          esac
          SHORT=$(echo "$SHA" | cut -c1-7)
          ORG="${{ secrets.DOCKER_USERNAME }}"; [ -z "$ORG" ] && ORG="dan1993"
          REPO="${{ secrets.GITOPS_REPO }}"
          if [ -z "$REPO" ]; then
            echo "::error::Secret GITOPS_REPO não definido. Use o formato owner/repo, ex: Danylo93/gitops-argocd"
            exit 1
          fi
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "SHORT=$SHORT" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "GITOPS_REPO=$REPO" >> $GITHUB_ENV

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}   # << TEM que ser owner/repo
          token: ${{ secrets.GITOPS_PAT }}     # << PAT com write no repo GitOps
          path: gitops

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update image and commit
        run: |
          cd gitops/k8s/overlays/${ENV}
          # tag imutável ENV-SHORT
          kustomize edit set image freelas-api=${ORG}/freelas-api:${ENV}-${SHORT}
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "api:${ENV}-${SHORT}" || echo "No changes"
          git push
