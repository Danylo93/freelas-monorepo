name: API CD

on:
  workflow_run:
    workflows: ["API Release"]          # roda apenas quando o CI terminar
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  FALLBACK_DOCKER_ORG: dan1993   # caso não defina DOCKER_USERNAME

jobs:
  build_and_push_images:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, matcher, web]   # ajuste se quiser só api

    steps:
      - name: Checkout same SHA as CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve ENV/TAGS from branch
        id: vars
        run: |
          BR="${{ github.event.workflow_run.head_branch }}"
          case "$BR" in
            develop) ENV=dev ;;
            hmg)     ENV=hmg ;;
            main|master) ENV=prd ;;
            *)       ENV=dev ;;
          esac
          SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          ORG="${{ secrets.DOCKER_USERNAME }}"; [ -z "$ORG" ] && ORG="$FALLBACK_DOCKER_ORG"
          echo "ENV=$ENV"                  >> $GITHUB_ENV
          echo "SHORT=$SHORT"              >> $GITHUB_ENV
          echo "DOCKER_ORG=$ORG"           >> $GITHUB_ENV
          echo "IMMUTABLE_TAG=${ENV}-${SHORT}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_API_URL=http://api.$ENV.localtest.me" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # publicamos tag mutável por ambiente e tag imutável (env-SHORTSHA)
          tags: |
            ${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.ENV }}
            ${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.IMMUTABLE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo "- \`${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.ENV }}\`"
            echo "- \`${{ env.DOCKER_ORG }}/freelas-${{ matrix.service }}:${{ env.IMMUTABLE_TAG }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
