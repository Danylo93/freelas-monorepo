services:
  mobile:
    image: node:23
    working_dir: /app
    command: sh -lc "corepack enable && yarn set version classic && yarn install && yarn start"
    environment:
      - EXPO_NO_TELEMETRY=1
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    volumes:
      - ./:/app