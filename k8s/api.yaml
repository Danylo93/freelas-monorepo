apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: freelas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: freelas-api
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: development
            - name: HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "3001"
            - name: KAFKA_BROKERS
              value: redpanda.freelas.svc.cluster.local:9092
            - name: REDIS_URL
              value: redis://redis:6379
            - name: USE_REAL_KAFKA
              value: "true"
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
            - name: USE_REAL_REDIS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: freelas
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
