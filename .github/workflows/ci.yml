name: CI

on:
  push:
    branches: [ main, master, develop, hmg, feature/** ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.decide.outputs.api }}
      matcher: ${{ steps.decide.outputs.matcher }}
      web: ${{ steps.decide.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/shared/**'
            matcher:
              - 'matcher/**'
              - 'packages/shared/**'
            web:
              - 'web/**'
            workflows:
              - '.github/workflows/**'
            k8s:
              - 'k8s/**'
            infra:
              - 'infra/**'
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'
              - 'tsconfig.base.json'
              - '.env.example'
              - '.npmrc'
              - 'README.md'

      - name: Decide which services run
        id: decide
        run: |
          API=${{ steps.filter.outputs.api }}
          MATCHER=${{ steps.filter.outputs.matcher }}
          WEB=${{ steps.filter.outputs.web }}
          ANY_INFRA=${{ steps.filter.outputs.workflows == 'true' || steps.filter.outputs.k8s == 'true' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.root == 'true' }}
          MSG=$(git log -1 --pretty=%B || echo '')
          if echo "$MSG" | grep -qiE '\[ci (all|full)\]|ci:(all|full)'; then
            ANY_INFRA=true
          fi

          # Fallbacks: em main/master sempre roda tudo se nada foi detectado; ou se infra/root mudou
          if [ "$API" != 'true' ] && [ "$MATCHER" != 'true' ] && [ "$WEB" != 'true' ]; then
            if [ "$ANY_INFRA" = 'true' ] || [[ "${{ github.ref_name }}" =~ ^(main|master|develop|hmg)$ ]]; then
              API=true; MATCHER=true; WEB=true;
            fi
          fi

          echo "api=$API" >> $GITHUB_OUTPUT
          echo "matcher=$MATCHER" >> $GITHUB_OUTPUT
          echo "web=$WEB" >> $GITHUB_OUTPUT

  api:
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock
      - name: API build+test
        working-directory: api
        run: |
          corepack enable
          yarn set version classic
          yarn install --frozen-lockfile || yarn install
          yarn build
          yarn test || echo "no tests"

  matcher:
    needs: [changes, api]
    if: (needs.api.result == 'success' || needs.api.result == 'skipped') && needs.changes.outputs.matcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Matcher build+test
        working-directory: matcher
        run: |
          corepack enable
          yarn set version classic
          yarn install
          yarn build
          yarn test || echo "no tests"

  web:
    needs: [changes, matcher]
    if: (needs.matcher.result == 'success' || needs.matcher.result == 'skipped') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web build (typecheck)
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          corepack enable
          yarn set version classic
          yarn install
          yarn build
