name: API CD

on:
  workflow_run:
    workflows: ["API Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev|hmg|prd"
        default: dev

permissions:
  contents: write

concurrency:
  group: api-cd-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  gitops:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve env/sha
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"; SHA="${{ github.sha }}"; BR="${{ github.ref_name }}"
          else
            BR="${{ github.event.workflow_run.head_branch }}"; SHA="${{ github.event.workflow_run.head_sha }}"
            case "$BR" in develop) ENV=dev ;; hmg) ENV=hmg ;; main|master) ENV=prd ;; *) ENV=dev ;; esac
          fi
          SHORT=$(echo "$SHA" | cut -c1-7)
          ORG="${{ secrets.DOCKER_USERNAME }}"; [ -z "$ORG" ] && ORG="dan1993"
          REPO="${{ secrets.GITOPS_REPO }}"
          [ -z "$REPO" ] && NO_GITOPS=true || NO_GITOPS=false
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "SHORT=$SHORT" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "GITOPS_REPO=$REPO" >> $GITHUB_ENV
          echo "NO_GITOPS=$NO_GITOPS" >> $GITHUB_ENV

      - name: Checkout GitOps repo
        if: env.NO_GITOPS != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        if: env.NO_GITOPS != 'true'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update image and commit
        if: env.NO_GITOPS != 'true'
        run: |
          cd gitops/k8s/overlays/${ENV}
          kustomize edit set image freelas-api=${ORG}/freelas-api:${ENV}-${SHORT}
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "api:${ENV}-${SHORT}" || echo "No changes"
          git push

      - name: Skip GitOps (not configured)
        if: env.NO_GITOPS == 'true'
        run: echo "::notice::GITOPS_REPO not set. Skipping API GitOps update."

