apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: freelas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-redpanda
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - >-
              echo "waiting for redpanda readiness...";
              until wget -qO- http://redpanda:9644/v1/status/ready >/dev/null 2>&1; do
                echo "redpanda not ready yet";
                sleep 2;
              done;
              echo "redpanda is ready";
      containers:
        - name: api
          image: freelas-api
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "3001"
            - name: KAFKA_BROKERS
              value: redpanda.freelas.svc.cluster.local:9092
            - name: REDIS_URL
              value: redis://redis:6379
            - name: USE_REAL_KAFKA
              value: "true"
            - name: USE_REAL_REDIS
              value: "true"
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
