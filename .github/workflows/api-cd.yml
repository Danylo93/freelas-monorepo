name: API CD

on:
  workflow_run:
    workflows: ["API Release"]      # tem que ser o name exato do workflow que builda a imagem
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev|hmg|prd"
        default: dev

permissions:
  contents: write

concurrency:
  group: api-cd-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  gitops:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver ENV/SHA e ORG
        run: |
          BR="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          case "$BR" in
            develop) ENV=dev ;; hmg) ENV=hmg ;; main|master) ENV=prd ;; *) ENV=dev ;;
          esac
          SHORT=$(echo "$SHA" | cut -c1-7)
          ORG="${{ secrets.DOCKER_USERNAME }}"; [ -z "$ORG" ] && ORG="dan1993"
          echo "ENV=$ENV"   >> $GITHUB_ENV
          echo "SHORT=$SHORT" >> $GITHUB_ENV
          echo "ORG=$ORG"   >> $GITHUB_ENV

      - name: Normalizar host e forçar HTTP
        env:
          GITEA_URL:  ${{ secrets.GITEA_URL }}     # ex: gitea.seudominio.com:3000  (sem http://)
          GITOPS_PATH: ${{ secrets.GITOPS_PATH }}  # ex: owner/gitops.git
        run: |
          if [ -z "$GITEA_URL" ] || [ -z "$GITOPS_PATH" ]; then
            echo "::error::Defina GITEA_URL (host[:port]) e GITOPS_PATH (owner/repo.git) em Secrets."
            exit 1
          fi
          CLEAN="${GITEA_URL#http://}"; CLEAN="${CLEAN#https://}"
          HOST="${CLEAN%%/*}"
          echo "CLEAN_URL=$CLEAN"   >> $GITHUB_ENV
          echo "HOST=$HOST"         >> $GITHUB_ENV
          echo "SCHEME=http"         >> $GITHUB_ENV   # << força HTTP

      - name: Preparar credenciais HTTP (.netrc)
        env:
          GITEA_USER: ${{ secrets.GITEA_USER }}
          GITEA_PAT:  ${{ secrets.GITEA_PAT }}
        run: |
          if [ -z "$GITEA_USER" ] || [ -z "$GITEA_PAT" ]; then
            echo "::error::Defina GITEA_USER e GITEA_PAT (token do Gitea com write)."
            exit 1
          fi
          cat <<EOF >> ~/.netrc
          machine ${HOST}
          login ${GITEA_USER}
          password ${GITEA_PAT}
          EOF
          chmod 600 ~/.netrc

      - name: Clonar GitOps via HTTP
        env:
          GITOPS_PATH: ${{ secrets.GITOPS_PATH }}
        run: |
          git clone --depth 1 "${SCHEME}://${CLEAN_URL}/${GITOPS_PATH}" gitops
          git -C gitops config user.email "action@github.com"
          git -C gitops config user.name "GitHub Action"

      - name: Instalar kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Atualizar imagem e push
        run: |
          mkdir -p gitops/k8s/overlays/${ENV}
          cd gitops/k8s/overlays/${ENV}
          [ -f kustomization.yaml ] || cat > kustomization.yaml <<'YAML'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          YAML
          kustomize edit set image freelas-api=${ORG}/freelas-api:${ENV}-${SHORT}
          git add .
          git commit -m "api:${ENV}-${SHORT}" || echo "No changes"
          git push
