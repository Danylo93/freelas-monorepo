name: Matcher Release

on:
  workflow_run:
    workflows: [Matcher Security]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "dev|hmg|prd"
        default: dev
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: dev

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: docker/setup-buildx-action@v3
      - name: Print previous Security result (if any)
        run: echo "Security conclusion: ${{ github.event.workflow_run.conclusion || 'n/a' }}"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'dan1993' }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve env/tag/version
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BR="${{ github.event.workflow_run.head_branch }}"; SHA="${{ github.event.workflow_run.head_sha }}";
            case "$BR" in develop) ENV=dev;; hmg) ENV=hmg;; main|master) ENV=prd;; *) ENV=dev;; esac
          else
            ENV="${{ inputs.environment || github.event.inputs.environment || 'dev' }}"; SHA="${{ github.sha }}";
          fi
          ORG="${{ secrets.DOCKER_USERNAME }}"; if [ -z "$ORG" ]; then ORG="dan1993"; fi
          SHORT=$(echo "$SHA" | cut -c1-7)
          VERSION=$(node -p "require('./matcher/package.json').version")
          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "SHA=$SHA" >> $GITHUB_ENV
          echo "SHORT=$SHORT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_IMMUT=$ENV-$SHA" >> $GITHUB_ENV
          echo "Releasing Matcher -> $ORG/freelas-matcher:$ENV and $ORG/freelas-matcher:$ENV-$SHA"
      - name: Build & Push Matcher
        uses: docker/build-push-action@v6
        with:
          context: ./matcher
          push: true
          tags: |
            ${{ env.ORG }}/freelas-matcher:${{ env.ENV }}
            ${{ env.ORG }}/freelas-matcher:${{ env.TAG_IMMUT }}
      - name: Create GitHub Release (Matcher)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: matcher-v${{ env.VERSION }}-${{ env.ENV }}-${{ env.SHORT }}
          name: Matcher v${{ env.VERSION }} (${{ env.ENV }})
          body: |
            Matcher Release
            - Version: v${{ env.VERSION }}
            - Env: ${{ env.ENV }}
            - Docker tags:
              - ${{ env.ORG }}/freelas-matcher:${{ env.ENV }}
              - ${{ env.ORG }}/freelas-matcher:${{ env.TAG_IMMUT }}
      - name: Summary
        run: |
          echo "Matcher Release" >> $GITHUB_STEP_SUMMARY
          echo "Version: v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "Env: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- $ORG/freelas-matcher:$ENV" >> $GITHUB_STEP_SUMMARY
          echo "- $ORG/freelas-matcher:$TAG_IMMUT" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Release tag: matcher-v$VERSION-$ENV-$SHORT" >> $GITHUB_STEP_SUMMARY
          echo "Deploy: handled by Matcher CD (if configured)" >> $GITHUB_STEP_SUMMARY
